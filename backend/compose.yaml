name: pedidos360

# La infraestructura (ZooKeeper, Kafka y RabbitMQ) se levanta desde
# ../docker-compose.yml. Esta red externa une ambos proyectos Compose.
services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-pedidos360}
      POSTGRES_USER: ${DB_USER:-pedidos360}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pedidos360_local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [pedidos360-infra]

  catalog-service:
    build:
      context: .
      args:
        SERVICE_MODULE: catalog-service
    environment: &backend-env
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
      ENTRA_ISSUER: ${ENTRA_ISSUER:?Copia .env.example a .env}
      ENTRA_JWKS_URI: ${ENTRA_JWKS_URI:?Copia .env.example a .env}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE:?Copia .env.example a .env}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost,http://localhost:4200,http://localhost:5173}
      DB_URL: ${DB_URL:-jdbc:postgresql://database:5432/pedidos360}
      DB_USER: ${DB_USER:-pedidos360}
      DB_PASSWORD: ${DB_PASSWORD:-pedidos360_local}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092,kafka-2:29092,kafka-3:29092}
      RABBIT_ADDRESSES: ${RABBIT_ADDRESSES:-rabbit-1:5672,rabbit-2:5672,rabbit-3:5672}
      RABBIT_USER: ${RABBITMQ_USER:-admin}
      RABBIT_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
      RABBIT_MANAGEMENT_URL: ${RABBIT_MANAGEMENT_URL:-http://rabbit-1:15672}
    expose: ["3001"]
    depends_on:
      database:
        condition: service_healthy
    networks: [pedidos360-infra]

  orders-service:
    build:
      context: .
      args:
        SERVICE_MODULE: orders-service
    environment:
      <<: *backend-env
      CATALOG_SERVICE_URL: http://catalog-service:3001
    expose: ["3000"]
    depends_on:
      database:
        condition: service_healthy
      catalog-service:
        condition: service_started
    networks: [pedidos360-infra]

  audit-service:
    build:
      context: .
      args:
        SERVICE_MODULE: audit-service
    environment:
      <<: *backend-env
      KAFKA_AUDIT_GROUP: audit-group
    expose: ["3002"]
    depends_on:
      database:
        condition: service_healthy
    networks: [pedidos360-infra]

  report-service:
    build:
      context: .
      args:
        SERVICE_MODULE: report-service
    environment:
      <<: *backend-env
      KAFKA_REPORT_GROUP: report-group
    expose: ["3003"]
    depends_on:
      database:
        condition: service_healthy
    networks: [pedidos360-infra]

  messaging-admin-service:
    build:
      context: .
      args:
        SERVICE_MODULE: messaging-admin-service
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
      ENTRA_ISSUER: ${ENTRA_ISSUER:?Copia .env.example a .env}
      ENTRA_JWKS_URI: ${ENTRA_JWKS_URI:?Copia .env.example a .env}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE:?Copia .env.example a .env}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost,http://localhost:4200,http://localhost:5173}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092,kafka-2:29092,kafka-3:29092}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      RABBIT_ADDRESSES: ${RABBIT_ADDRESSES:-rabbit-1:5672,rabbit-2:5672,rabbit-3:5672}
      RABBIT_USER: ${RABBITMQ_USER:-admin}
      RABBIT_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
      RABBIT_MANAGEMENT_URL: ${RABBIT_MANAGEMENT_URL:-http://rabbit-1:15672}
    expose: ["3004"]
    networks: [pedidos360-infra]

  frontend-angular:
    build:
      context: ../frontend-angular
    environment:
      API_BASE_URL: ${API_BASE_URL:-}
      ENTRA_SPA_CLIENT_ID: ${ENTRA_SPA_CLIENT_ID:-d0b2e05c-58b9-4d02-aade-281d22bb3074}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-1a1fed8a-8960-4a10-95a1-f9d77a98832a}
      ENTRA_SCOPE: ${ENTRA_SCOPE:-api://d0b2e05c-58b9-4d02-aade-281d22bb3074/access_as_user}
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-80}:80"
      - "${API_BIND:-0.0.0.0}:${API_PORT:-3000}:3000"
    depends_on:
      orders-service:
        condition: service_started
      catalog-service:
        condition: service_started
      audit-service:
        condition: service_started
      report-service:
        condition: service_started
      messaging-admin-service:
        condition: service_started
    networks: [pedidos360-infra]

volumes:
  postgres-data:

networks:
  pedidos360-infra:
    external: true
    name: pedidos360-ep5-infra_default
